services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: support
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support"]
      interval: 3s
      retries: 20

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py seed_demo && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://support:support@db:5432/support
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: python manage.py run_support_worker
    env_file: .env
    environment:
      DATABASE_URL: postgres://support:support@db:5432/support
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  pgdata:
